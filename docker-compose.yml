version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: event_planner_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: event_planner_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: